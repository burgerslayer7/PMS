name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install test dependencies
        run: sudo apt-get update && sudo apt-get install -y lua5.1 python3-pil
      - name: Run unit and asset gates
        run: LUA_BIN=lua5.1 tools/test.sh

  package:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build launcher archive
        run: tools/package.sh dist
      - uses: actions/upload-artifact@v4
        with:
          name: pokemon-mount-system
          path: dist/*
